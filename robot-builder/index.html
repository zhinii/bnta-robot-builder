<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Robot Lab · Build for a purpose</title><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"../beginner-3axis/vendor/three/build/three.module.js"}}</script></head>
<body>
<header class="topbar"><a class="brand" href="../beginner-3axis/teacher.html"><span class="brand-icon">R<span>·</span></span><span><strong data-copy="title"></strong><small data-copy="subtitle"></small></span></a><nav class="mode-switch" aria-label="Workspace / 工作区"><button id="build-mode" data-copy="build" aria-pressed="true"></button><button id="test-mode" data-copy="test"></button><button id="think-mode" data-copy="think"></button></nav><div class="file-actions"><button id="undo" data-copy="undo"></button><button id="import" data-copy="open"></button><button id="export" data-copy="save"></button><select id="language" aria-label="Language / 语言"><option value="en">EN</option><option value="zh">中文</option></select></div></header>
<main>
<section class="workspace" aria-label="Robot task scene / 机器人任务场景"><div class="scene-heading"><div><span class="eyebrow" data-copy="challenge"></span><h1 id="scenario-title"></h1><p id="scenario-tag"></p></div><button id="scenario-switch" data-copy="chooseScenario"></button></div><div id="scene"><div id="no3d" hidden data-copy="no3d"></div></div><div class="scene-tools"><button id="view-all" data-copy="sceneView"></button><button id="view-home" data-copy="homeView"></button><button id="view-top" data-copy="topView"></button><button id="labels" data-copy="labels" aria-pressed="true"></button></div><div class="scene-hint" data-copy="sceneHint"></div><div id="geometry-warning" role="status" hidden></div><div class="scene-bottom"><span id="tool-badge"></span><strong id="scene-status"></strong><span id="trial-count"></span></div></section>
<aside><div class="budget"><div class="budget-title"><span data-copy="budget"></span><strong id="money-total"></strong></div><progress id="money-meter" max="1200" value="0" aria-label="Parts budget / 零件预算"></progress><div class="budget-summary"><span id="money-remaining"></span><span id="total-length"></span></div><div class="slot-heading"><span data-copy="jointSlots"></span><strong id="slot-count"></strong></div><div id="slots"></div></div><div class="panel-scroll">
<div class="task-brief"><span class="step-tag" data-copy="yourTask"></span><p id="brief-text"></p></div>
<div id="legacy-notice" class="notice" hidden><p data-copy="legacyNotice"></p><button id="download-old" data-copy="downloadOld"></button></div>
<section id="build-panel">
 <div class="section-heading"><h2 data-copy="base"></h2></div><div class="base-options"><button id="fixed-base"><span class="base-symbol">⊥</span><strong data-copy="fixed"></strong><small>$100</small></button><button id="rover-base"><span class="base-symbol">▰</span><strong data-copy="rover"></strong><small>$400 · <span data-copy="oneSlot"></span></small></button></div><p id="base-help" class="help"></p>
 <section id="mount-controls"><h3 data-copy="mountTitle"></h3><p class="help" data-copy="mountHelp"></p><div id="mount-pads" class="pad-options"></div></section>
 <div class="section-heading"><h2 data-copy="chain"></h2><button id="add-joint" class="text-button" data-copy="add"></button></div><p class="help" data-copy="chainHelp"></p><div id="joint-list" class="joint-list"></div>
 <section class="joint-editor"><div class="section-heading"><h3 id="joint-title"></h3><button id="remove-joint" class="text-button" data-copy="remove"></button></div><label class="field-label" data-copy="axis"></label><div class="segmented"><button data-axis="z"><b>↔</b><span data-copy="turn"></span></button><button data-axis="y"><b>↕</b><span data-copy="bend"></span></button></div><label class="field-label" data-copy="length"></label><div id="length-options" class="length-options"></div></section>
 <p class="thinking-prompt" id="scenario-question"></p><button id="start-test" class="primary wide" data-copy="startTest"></button>
 <details class="price-list"><summary data-copy="priceList"></summary><p data-copy="classroomPrices"></p><dl id="receipt"></dl><p class="help" data-copy="roverTrade"></p></details>
</section>
<section id="test-panel" hidden>
 <p id="mount-locked" class="help"></p><div class="task-progress"><div id="task-dots"></div><span id="task-progress"></span></div>
 <div class="task-step"><span class="step-tag" id="step-number"></span><h2 id="step-title"></h2><p id="task-feedback" role="status"></p><button id="try-step" class="primary wide" data-copy="tryStep"></button><button id="stop" class="wide" data-copy="stop" hidden></button></div>
 <section id="rover-controls" hidden><h3 data-copy="drive"></h3><p class="help" data-copy="driveHelp"></p><div id="station-buttons" class="station-buttons"></div></section>
 <div class="paired"><button id="reset-trial" data-copy="resetTrial"></button><button id="revise-design" data-copy="reviseDesign"></button></div>
 <details class="fine-tune"><summary data-copy="fineTune"></summary><p class="help" data-copy="fineHelp"></p><div id="joint-controls"></div><p id="tip-position" class="help"></p><div id="target-readings"></div></details>
</section>
<section id="think-panel" hidden><h2 data-copy="designThinking"></h2><p class="help" data-copy="thinkHelp"></p>
 <label for="note-prediction" data-copy="prediction"></label><textarea id="note-prediction" rows="2" maxlength="3000"></textarea>
 <label for="note-choice" data-copy="choice"></label><textarea id="note-choice" rows="2" maxlength="3000"></textarea>
 <label for="note-observation" data-copy="observation"></label><textarea id="note-observation" rows="2" maxlength="3000"></textarea>
 <label for="note-revision" data-copy="revision"></label><textarea id="note-revision" rows="2" maxlength="3000"></textarea>
 <button id="record" class="primary wide" data-copy="record"></button><div id="evidence-list"></div>
 <a class="lesson-link" href="../beginner-3axis/teacher.html" data-copy="lesson"></a>
</section>
</div><footer><span id="save-status"></span><details><summary data-copy="modelNotes"></summary><p data-copy="modelNotesText"></p></details></footer></aside>
</main>
<dialog id="scenario-picker"><div class="picker-heading"><div><span class="eyebrow" data-copy="chooseProblem"></span><h2 data-copy="pickerTitle"></h2></div><button id="picker-close" data-copy="close"></button></div><p data-copy="pickerHelp"></p><div id="scenario-cards"></div><p class="picker-footer" data-copy="pickerFooter"></p></dialog>
<div id="message" role="status" hidden></div><input id="file" type="file" accept=".json,application/json" hidden><script type="module" src="./app.mjs"></script>
</body></html>
