<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Lab · Robot Builder</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"../beginner-3axis/vendor/three/build/three.module.js"}}</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../beginner-3axis/teacher.html" title="Robot Lab"><span class="brand-icon">R<span>·</span></span><span><strong data-copy="title"></strong><small data-copy="subtitle"></small></span></a>
    <nav class="mode-switch" aria-label="Workspace / 工作区"><button id="build-mode" data-copy="build" aria-pressed="true"></button><button id="test-mode" data-copy="test" aria-pressed="false"></button><button id="think-mode" data-copy="think" aria-pressed="false"></button></nav>
    <div class="file-actions"><button id="undo" data-copy="undo" disabled></button><button id="import" data-copy="open"></button><button id="export" class="primary" data-copy="save"></button><select id="language" aria-label="Language / 语言"><option value="en">EN</option><option value="zh">中文</option></select></div>
  </header>
  <main>
    <section class="workspace" aria-label="Robot and greenhouse / 机器人与温室">
      <div class="scene-heading"><div><span class="eyebrow" data-copy="challenge"></span><h1 data-copy="greenhouse"></h1></div><button id="brief-toggle" aria-expanded="false" aria-controls="brief" data-copy="brief"></button></div>
      <div id="brief" hidden><h2 data-copy="briefTitle"></h2><p data-copy="briefText"></p><p class="brief-rule" data-copy="briefRule"></p><a href="../beginner-3axis/teacher.html" target="_blank" rel="noopener" data-copy="lesson"></a></div>
      <div id="scene"><div id="no3d" hidden data-copy="no3d"></div></div>
      <div class="scene-tools"><button id="view-home" data-copy="homeView"></button><button id="view-top" data-copy="topView"></button><button id="labels" aria-pressed="true" data-copy="labels"></button></div>
      <div class="scene-hint" data-copy="sceneHint"></div>
      <div id="geometry-warning" hidden role="status"></div>
      <div class="readout"><div><span data-copy="cameraPosition"></span><strong id="tip-position"></strong></div><div><span data-copy="selectedAxis"></span><strong id="axis-readout"></strong></div><div class="scale-note"><span data-copy="units"></span><strong data-copy="grid"></strong></div></div>
    </section>
    <aside>
      <div class="budget"><div class="budget-title"><span data-copy="budget"></span><strong id="slot-count"></strong></div><div id="slots" aria-label="Six design slots / 六个设计名额"></div><p data-copy="budgetRule"></p></div>
      <div class="panel-scroll">
        <section id="build-panel">
          <label class="field-label" for="robot-name" data-copy="name"></label><input id="robot-name" maxlength="70">
          <div class="section-heading"><h2 data-copy="base"></h2><span data-copy="baseChoice"></span></div>
          <div class="base-options"><button id="fixed-base"><span class="base-symbol">⊥</span><strong data-copy="fixed"></strong><small data-copy="freeBase"></small></button><button id="rover-base"><span class="base-symbol">▰</span><strong data-copy="rover"></strong><small data-copy="oneSlot"></small></button></div>
          <p id="base-help" class="help"></p>
          <div class="section-heading"><h2 data-copy="chain"></h2><button id="add-joint" class="text-button" data-copy="add"></button></div>
          <div id="joint-list" class="joint-list" aria-label="Arm joints / 机械臂关节"></div>
          <section class="joint-editor"><div class="section-heading"><h2 id="joint-title"></h2><button id="remove-joint" class="text-button danger" data-copy="remove"></button></div>
            <label class="field-label" data-copy="axis"></label><div id="axis-options" class="segmented"><button data-axis="x">X</button><button data-axis="y">Y</button><button data-axis="z">Z</button></div><p class="help" data-copy="axisHelp"></p>
            <label class="field-label" for="link-length" data-copy="length"></label><select id="link-length"><option value="200" data-copy="short"></option><option value="350" data-copy="medium"></option><option value="500" data-copy="long"></option></select>
            <label class="field-label" for="joint-angle" data-copy="pose"></label><div class="slider-row"><input id="joint-angle" type="range" step="1"><input id="joint-angle-number" type="number" step="1" aria-label="Selected joint angle in degrees / 所选关节角度"></div>
            <details id="joint-details"><summary data-copy="jointDetails"></summary><label class="field-label" for="link-direction" data-copy="linkDirection"></label><select id="link-direction"><option value="+x">+X</option><option value="-x">−X</option><option value="+y">+Y</option><option value="-y">−Y</option><option value="+z">+Z</option><option value="-z">−Z</option></select><div class="limit-fields"><label><span data-copy="minAngle"></span><input id="limit-min" type="number" min="-180" max="179" step="1"></label><label><span data-copy="maxAngle"></span><input id="limit-max" type="number" min="-179" max="180" step="1"></label></div><p class="help" data-copy="limitHelp"></p></details>
          </section>
          <div class="thinking-prompt"><span data-copy="lessonConnection"></span><p data-copy="buildPrompt"></p></div>
        </section>
        <section id="test-panel" hidden>
          <div class="section-heading"><h2 data-copy="moveJoints"></h2><button id="reset-pose" class="text-button" data-copy="resetPose"></button></div><p class="help" data-copy="testHelp"></p><div id="joint-controls"></div>
          <section id="rover-controls" hidden><div class="section-heading"><h2 data-copy="drive"></h2><span id="rover-position"></span></div><p class="help" data-copy="driveHelp"></p><div class="drive-controls"><button id="forward" data-copy="forward"></button><button id="left" data-copy="left"></button><button id="backward" data-copy="backward"></button><button id="right" data-copy="right"></button></div></section>
          <div class="section-heading"><h2 data-copy="inspect"></h2><span data-copy="feedback"></span></div><p class="help" data-copy="inspectHelp"></p><div id="target-readings"></div>
          <div class="thinking-prompt"><span data-copy="lessonConnection"></span><p data-copy="testPrompt"></p></div>
        </section>
        <section id="think-panel" hidden>
          <div class="section-heading"><h2 data-copy="designThinking"></h2></div><p class="help" data-copy="thinkHelp"></p>
          <label class="note-label" for="note-prediction"><span>01</span><strong data-copy="prediction"></strong></label><p class="help" data-copy="predictionPrompt"></p><textarea id="note-prediction" rows="3" maxlength="3000"></textarea>
          <label class="note-label" for="note-choice"><span>02</span><strong data-copy="choice"></strong></label><p class="help" data-copy="choicePrompt"></p><textarea id="note-choice" rows="3" maxlength="3000"></textarea>
          <label class="note-label" for="note-observation"><span>03</span><strong data-copy="observation"></strong></label><p class="help" data-copy="observationPrompt"></p><textarea id="note-observation" rows="3" maxlength="3000"></textarea>
          <label class="note-label" for="note-revision"><span>04</span><strong data-copy="revision"></strong></label><p class="help" data-copy="revisionPrompt"></p><textarea id="note-revision" rows="3" maxlength="3000"></textarea>
          <button id="record" class="primary wide" data-copy="record"></button><div id="evidence-list"></div>
          <a class="lesson-link" href="../beginner-3axis/teacher.html" target="_blank" rel="noopener" data-copy="lesson"></a>
        </section>
      </div>
      <footer><span id="save-status"></span><details><summary data-copy="modelNotes"></summary><p data-copy="modelNotesText"></p></details></footer>
    </aside>
  </main>
  <div id="message" role="status" aria-live="polite" hidden></div>
  <input id="file" type="file" accept="application/json,.json" hidden>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
